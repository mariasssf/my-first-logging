<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Matrix Chat</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/alpinejs" defer></script>
  <script src="./login/login.js"></script>
  <script src="./sidebar/sidebar.js"></script>
  <script src="./chat/chat.js"></script>
  <script src="./user/user.js"></script>
  <link rel="stylesheet" href="./login/login.css">
  <link rel="stylesheet" href="./chat/chat.css">
  <link rel="stylesheet" href="index.css">
</head>

<body class="index-container bg-gray-100 flex justify-center">
  <div x-data="chatApp()" class="flex w-full">
    <!-- Контейнер для сайдбару з кімнатами -->
    <div id="sidebar-container"></div>
    
    <!-- Контейнер для сайдбару з користувачами -->
    <div id="user-container"></div>

    <!-- Контейнер для основної області чату -->
    <div class="chat-area p-4 flex flex-col w-full">
      <!-- Контейнер для логіну -->
      <div id="login-container"></div>
      
      <!-- Контейнер для чату -->
      <div id="chat-component-container"></div>
    </div>
  </div>

  <script>
    // Завантаження HTML-шаблонів після завантаження DOM
    document.addEventListener('DOMContentLoaded', () => {
      // Завантаження login.html
      fetch('./login/login.html')
        .then(response => response.text())
        .then(html => {
          document.getElementById('login-container').innerHTML = html;
        })
        .catch(error => console.error('Error loading login:', error));

      // Завантаження sidebar.html
      fetch('./sidebar/sidebar.html')
        .then(response => response.text())
        .then(html => {
          document.getElementById('sidebar-container').innerHTML = html;
        })
        .catch(error => console.error('Error loading sidebar:', error));

      // Завантаження user.html
      fetch('./user/user.html')
        .then(response => response.text())
        .then(html => {
          document.getElementById('user-container').innerHTML = html;
        })
        .catch(error => console.error('Error loading user:', error));

      // Завантаження chat.html
      fetch('./chat/chat.html')
        .then(response => response.text())
        .then(html => {
          document.getElementById('chat-component-container').innerHTML = html;
        })
        .catch(error => console.error('Error loading chat:', error));
    });
  </script>

  <script>
    function chatApp() {
      return {
        username: '',
        password: '',
        accessToken: '',
        userId: '',
        roomId: '',
        joinRoomId: '',
        newRoomName: '',
        newRoomId: '',
        rooms: [],
        messages: [],
        newMessage: '',
        inviteUser: '',
        error: '',
        lastSyncToken: '',
        roomMembers: [],
        login,
        createRoom,
        fetchRoomsWithNames,
        joinRoom,
        inviteUserToRoom,
        getRoomName,
        switchRoom,
        sendMessage,
        fetchMessages,
        fetchRoomMembers,
        leaveRoom,  // ← Додано
        kickUser    // ← Додано
      }
    }

    // Функція для отримання учасників кімнати
    async function fetchRoomMembers() {
      if (!this.accessToken || !this.roomId) return;
      try {
        const res = await fetch(
          `https://matrix.org/_matrix/client/r0/rooms/${encodeURIComponent(this.roomId)}/joined_members`,
          {
            headers: { 'Authorization': `Bearer ${this.accessToken}` }
          }
        );
        const data = await res.json();
        this.roomMembers = Object.entries(data.joined || {}).map(([userId, info]) => ({
          userId,
          displayName: info.display_name || userId.split(':')[0].substring(1),
          avatarUrl: info.avatar_url
        }));
      } catch (e) {
        console.error('Error fetching room members:', e);
      }
    }

    // Оновлена функція switchRoom
    async function switchRoom(roomId) {
      if (roomId) this.roomId = roomId;
      this.messages = [];
      this.lastSyncToken = '';

      await this.fetchMessages();
      await this.fetchRoomMembers();
    }
  </script>
</body>
</html>
