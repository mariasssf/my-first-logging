<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Matrix Chat</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/alpinejs" defer></script>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">
  <div x-data="chatApp()" 
       :class="{'w-96 h-[600px]': accessToken, 'w-96 h-96': !accessToken}"
       class="bg-white p-6 rounded shadow-md transition-all duration-500">

    <!-- Форма логіну -->
    <template x-if="!accessToken">
      <div>
        <h2 class="text-xl font-bold mb-4">Логін</h2>
        <input x-model="username" placeholder="Username"
               class="border p-2 w-full mb-2 rounded" />
        <input x-model="password" type="password" placeholder="Password"
               class="border p-2 w-full mb-2 rounded" />
        <button @click="login()" class="bg-blue-500 text-white p-2 w-full rounded hover:bg-blue-600 transition">
          Увійти
        </button>
        <p x-text="error" class="text-red-500 mt-2"></p>
      </div>
    </template>

    <!-- Панель після авторизації -->
    <template x-if="accessToken">
      <div>
        <h1 class="text-green-600 text-xl font-bold text-center mb-2">
          Ви успішно авторизувались
        </h1>
        <p class="text-gray-700 text-center mb-4">User ID: <span x-text="userId"></span></p>
        
        <!-- Резюме користувача -->
        <div class="bg-gray-50 p-4 rounded shadow mb-4">
          <h3 class="text-lg font-semibold mb-2">Марія Борознюк</h3>
          <p><strong>Професія:</strong> Курсант</p>
          <p><strong>Навички:</strong> HTML, CSS,  JavaScript</p>
          <p><strong>Досвід:</strong> Робота над навчальними проєктами</p>
          <p><strong>Контакти:</strong> email@example.com</p>
        </div>

        <button @click="logout()" class="bg-gray-400 text-white p-2 w-full rounded hover:bg-gray-500 transition">
          Вийти
        </button>
      </div>
    </template>
  </div>

  <script>
    function chatApp() {
      return {
        username: 'mariaiiaia34', // твій Matrix акаунт
        password: '',
        accessToken: '',
        userId: '',
        error: '',

        async login() {
          try {
            let user = this.username.replace('@', '').replace(':matrix.org', '');

            const res = await fetch('https://matrix.org/_matrix/client/v3/login', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                type: 'm.login.password',
                user: user,
                password: this.password
              })
            });

            const data = await res.json();

            if (data.access_token) {
              this.accessToken = data.access_token;
              this.userId = data.user_id;
              this.error = '';
            } else {
              this.error = 'Невірний логін або пароль'; // 🔹 локалізація
              console.error(data);
            }
          } catch (e) {
            this.error = 'Помилка під час входу';
            console.error(e);
          }
        },

        logout() {
          this.accessToken = '';
          this.username = 'mariaiiaia34'
          this.password = '';
          this.userId = '';
          this.error = '';
        }
      }
    }
  </script>
</body>
</html>
