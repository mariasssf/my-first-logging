<template x-if="accessToken">
  <div class="chat-interface">
    <!-- User ID та Room ID -->
    <div class="chat-header">
      <div class="user-info">
        <span class="label">Your Matrix ID:</span>
        <span x-text="userId ? userId : 'Loading...'"></span>
      </div>
      <div class="room-info">
        <span class="label">Room ID:</span>
        <span x-text="roomId || 'Not selected'" class="room-id" @click="$clipboard(roomId)"></span>
        <span class="copy-hint">(Click to copy)</span>
      </div>
    </div>
    
    <!-- Список повідомлень -->
    <div id="messages" class="flex-1 overflow-y-auto mb-4 p-2 bg-gray-50 rounded border border-gray-200 messages-container">
      <template x-if="messages.length === 0">
        <p class="text-gray-500 text-center no-messages">No messages yet. Start the conversation!</p>
      </template>
      <template x-for="msg in messages" :key="msg.id">
        <div class="mb-2 p-2 rounded hover:bg-gray-100 group relative message">
          <div class="flex items-start justify-between">
            <div class="flex-1">
              <strong x-text="msg.sender === userId ? 'You' : msg.sender.split(':')[0].substring(1) + ':'"></strong>
              <span x-text="msg.body" class="ml-2 break-words message-body"></span>
              <span x-show="msg.edited" class="text-xs text-gray-500 ml-2">(edited)</span>
            </div>

            <!-- Кнопки тільки для своїх повідомлень -->
            <template x-if="msg.sender === userId">
              <div class="hidden group-hover:flex space-x-1 ml-2">
                <button @click="startEdit(msg.id, msg.body)"
                        class="text-xs text-blue-600 hover:underline">Edit</button>
                <button @click="deleteMessage(msg.id)"
                        class="text-xs text-red-600 hover:underline">Delete</button>
              </div>
            </template>
          </div>

          <!-- Поле редагування (показується при editMode) -->
          <div x-show="editMode === msg.id" class="mt-2">
            <textarea x-model="editText"
                      @keyup.enter="saveEdit(msg.id)"
                      @keyup.escape="cancelEdit()"
                      class="w-full p-1 border rounded text-sm resize-none"
                      rows="2"></textarea>
            <div class="flex space-x-1 mt-1">
              <button @click="saveEdit(msg.id)" class="text-xs bg-green-600 text-white px-2 py-1 rounded">Save</button>
              <button @click="cancelEdit()" class="text-xs bg-gray-400 text-white px-2 py-1 rounded">Cancel</button>
            </div>
          </div>
        </div>
      </template>
    </div>
    
    <!-- Поле для введення повідомлення -->
    <div class="message-input-section">
      <textarea x-model="newMessage" 
                placeholder="Type your message here..." 
                class="message-input"
                @keyup.enter="sendMessage()"></textarea>
      <button @click="sendMessage()" class="send-button">Send Message</button>
    </div>
    
    <!-- Запрошення та приєднання -->
    <div class="room-actions">
      <div class="invite-section">
        <input x-model="inviteUser" placeholder="Invite user (e.g., @user:matrix.org)" class="action-input">
        <button @click="inviteUserToRoom()" class="action-button invite">Invite User</button>
      </div>
      <div class="join-section">
        <input x-model="joinRoomId" placeholder="Room ID to join (e.g., !roomId:matrix.org)" class="action-input">
        <button @click="joinRoom()" class="action-button join">Join Room</button>
      </div>
    </div>
  </div>
</template>
